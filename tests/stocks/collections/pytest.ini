[pytest]
# 配置 pytest 收集以数字开头的测试文件
python_files = *_collection.py test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .

# 注册自定义标记
markers =
    integration: 集成测试标记
    slow: 慢速测试标记
    playwright: Playwright UI 自动化测试标记
